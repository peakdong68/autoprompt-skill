name: Installer portability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-installer:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x']

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Windows includes powershell.exe. The other runners use pwsh when the
      # host image provides it; installing it on macOS keeps the packed PS1
      # lifecycle on the same revision and prevents a silent platform skip.
      - name: Install installer shells on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install bash
          brew install powershell

      - name: Require PowerShell for the native script checks
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Install bundled test dependencies
        run: npm ci --ignore-scripts

      - name: Run the packed installer lifecycle
        run: node --test --test-concurrency=1 tests/source/packed-harness-v2-lifecycle.test.cjs
